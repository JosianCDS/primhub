<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="Primhub" />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="primhub" />
    <link rel="apple-touch-icon" href="icons/LogoPrimHub.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="LogoPrimHub.png" />

    <title>primhub</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <div
      id="loading"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #ffffff;
        font-family: &quot;Montserrat&quot;, sans-serif;
      "
    >
      <p
        style="
          color: #4b4276;
          font-size: 24px;
          margin-top: 10px;
          font-weight: 600;
        "
      >
        primhub
      </p>
      <p style="color: #4b4276; font-size: 18px; margin-top: 10px">
        Cargando...
      </p>
    </div>

    <script src="flutter_bootstrap.js" async></script>

    <script>
      window.addEventListener("flutter-first-frame", function () {
        const loader = document.getElementById("loading");
        if (loader) loader.style.display = "none";
      });
    </script>
  </body>
</html>
